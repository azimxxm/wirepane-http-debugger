<!doctype html>
<!-- Loading screen wordmark, rendered to httptoolkit-ui/src/images/loading-logo.png by build-icons.sh -->
<html>
<head>
  <meta charset="utf-8">
  <style>
    @font-face {
      font-family: 'DM Sans';
      font-weight: 700;
      src: url('../httptoolkit-ui/node_modules/@fontsource/dm-sans/files/dm-sans-latin-700-normal.woff2') format('woff2');
    }

    html, body {
      margin: 0;
      background: transparent;
      overflow: hidden; /* scrollbars would end up in the captured image */
    }

    .wordmark {
      width: 1200px;
      height: 184px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 44px;
    }

    .wordmark img {
      width: 184px;
      height: 184px;
    }

    .wordmark span {
      font: 700 150px/1 'DM Sans';
      letter-spacing: -3px;
      color: #16243F;
    }
  </style>
</head>
<body>
  <div class="wordmark">
    <img src="../httptoolkit-ui/src/images/logo-icon.svg" alt="">
    <span>Wirepane</span>
  </div>
</body>
</html>
